<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genshare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#171329;--mut:#737084;--line:#E9E7EF;--pri:#6D28D9;--pri2:#8B5CF6;--tint:#F1EBFD;--err:#DC2626;--ok:#16A34A}
@media (prefers-color-scheme:dark){:root{--bg:#171329;--card:#201a3a;--ink:#F8FAFC;--mut:#A9A5BD;--line:#332b52;--pri:#8B5CF6;--tint:#2a2050;--err:#F87171;--ok:#4ADE80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2{font-family:Poppins,Inter,sans-serif;font-weight:600;margin:0}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 90px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600}
.btn:disabled{opacity:.6}
.link{color:var(--pri);font-weight:600;min-height:44px}
label.f{display:block;margin-bottom:12px;font-size:.9rem;color:var(--mut)}
input[type=text],input[type=email],input[type=password],textarea{display:block;width:100%;height:48px;margin-top:4px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{height:84px;padding:12px;resize:none}
.msg{min-height:1.3em;font-size:.88rem;margin:6px 0 10px;color:var(--err)}.msg.ok{color:var(--ok)}
.logo{display:flex;align-items:center;gap:8px;font:600 1.4rem Poppins;color:var(--pri);margin-bottom:14px}
.note{font-size:.8rem;color:var(--mut);text-align:center;margin:14px 0}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:10px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--pri);display:grid;place-items:center;font-weight:600;flex:none}
.ph small{display:block;color:var(--mut);line-height:1.1}
.pic{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--tint)}
.pa{display:flex;padding:2px 6px;flex-wrap:wrap}
.pa button{min-width:44px;height:44px;padding:0 8px;display:flex;align-items:center;gap:4px;color:var(--mut)}
.pa .on{color:var(--pri)}.pa .on svg{fill:currentColor}.pa .sp{flex:1}
.cap{padding:0 12px 12px}
.cm{border-top:1px solid var(--line);padding:10px 12px;font-size:.92rem}
.cm p{margin:0 0 6px;overflow-wrap:anywhere}
.cm form{display:flex;gap:6px}.cm input{margin:0;height:44px}.cm button.s{background:var(--pri);color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
.rp{display:flex;gap:6px;padding:0 12px 10px}.rp button{border:1.5px solid var(--line);border-radius:18px;height:38px;padding:0 12px;font-size:.85rem}
#prev{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin-bottom:12px;display:block}
.pick{display:grid;place-items:center;aspect-ratio:1/1;border:2px dashed var(--pri2);border-radius:14px;color:var(--pri);margin-bottom:12px;cursor:pointer;font-weight:600}
.pick input{display:none}
.chk{display:flex;gap:10px;font-size:.88rem;color:var(--mut);margin:8px 0}.chk input{width:22px;height:22px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:16px}.grid img{width:100%;aspect-ratio:1/1;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:430px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--mut)}
nav button.on{color:var(--pri)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<section id="auth">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 48 48"><circle cx="16" cy="16" r="5" fill="currentColor"/><circle cx="32" cy="16" r="5" fill="currentColor"/><circle cx="24" cy="32" r="5" fill="currentColor"/><path d="M16 16h16l-8 16z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>Genshare</div>
  <h2 id="at">Welcome back</h2>
  <p style="color:var(--mut);margin:4px 0 14px">Connect. Share. Grow.</p>
  <label class="f" id="nameRow" hidden>Full name<input type="text" id="fn" autocomplete="name"></label>
  <label class="f">Email<input type="email" id="em" autocomplete="email"></label>
  <label class="f">Password (8+ characters)<input type="password" id="pw" autocomplete="current-password"></label>
  <label class="chk" id="tosRow" hidden><input type="checkbox" id="tos"><span>I agree to the <a href="terms.html" target="_blank" rel="noopener" style="color:var(--pri)">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener" style="color:var(--pri)">Privacy Policy</a>.</span></label>
  <div class="msg" id="amsg" role="alert"></div>
  <button class="btn" id="abtn">Log in</button>
  <p class="note"><span id="swq">New here?</span> <button class="link" id="sw">Create an account</button></p>
</section>

<div id="app" hidden>
  <section id="t-feed"><div class="logo">Genshare</div><div id="feed"></div></section>

  <section id="t-create" hidden>
    <h2 style="margin-bottom:12px">New post</h2>
    <img id="prev" alt="Preview" hidden>
    <label class="pick" id="pickBox"><input type="file" id="pic" accept="image/*">Choose a photo</label>
    <textarea id="cap" maxlength="200" placeholder="Write a caption"></textarea>
    <label class="chk"><input type="checkbox" id="own"><span>I took this photo or own the rights to it. Copied content is removed when reported.</span></label>
    <div class="msg" id="cmsg" role="alert"></div>
    <button class="btn" id="share">Share</button>
  </section>

  <section id="t-profile" hidden>
    <h2 style="margin-bottom:12px">Your profile</h2>
    <label class="f">Full name<input type="text" id="pf" maxlength="50"></label>
    <label class="f">Username (letters, numbers, underscore)<input type="text" id="pu" maxlength="20" autocapitalize="none"></label>
    <label class="f">Bio<textarea id="pb" maxlength="150"></textarea></label>
    <div class="msg" id="pmsg" role="alert"></div>
    <button class="btn" id="psave">Save profile</button>
    <div class="grid" id="pgrid"></div>
    <p class="note"><button class="link" id="out">Log out</button></p>
  </section>

  <nav id="nav"></nav>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
var SUPABASE_URL='https://yaullbkkzefnuylgvgan.supabase.co';
var SUPABASE_KEY='sb_publishable_eQ3rSaDwGGyGedK_yF9KXA_91wi_zMI';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
var me=null,prof=null,feed=[],mode='login';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ago(t){var s=(Date.now()-new Date(t))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';return Math.floor(s/86400)+' d ago'}
function url(path){return sb.storage.from('posts').getPublicUrl(path).data.publicUrl}
var IC={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/>',plus:'<path d="M12 5v14M5 12h14"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',comment:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/>',flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
function svg(n,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
var tabs=[['feed','home','Home'],['create','plus','Create'],['profile','user','Profile']];
$('nav').innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'">'+svg(t[1])+t[2]+'</button>'}).join('');
function show(t){tabs.forEach(function(x){$('t-'+x[0]).hidden=x[0]!==t});
  Array.prototype.forEach.call($('nav').children,function(b){b.classList.toggle('on',b.dataset.tab===t)});
  if(t==='feed')loadFeed();if(t==='profile')loadProfile();window.scrollTo(0,0)}
$('nav').onclick=function(e){var b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)};

/* ---------- Auth ---------- */
function setMode(m){mode=m;var s=m==='signup';
  $('at').textContent=s?'Create your account':'Welcome back';$('abtn').textContent=s?'Create account':'Log in';
  $('nameRow').hidden=!s;$('tosRow').hidden=!s;$('swq').textContent=s?'Already registered?':'New here?';
  $('sw').textContent=s?'Log in':'Create an account';$('amsg').textContent='';$('amsg').className='msg';
  $('pw').autocomplete=s?'new-password':'current-password'}
$('sw').onclick=function(){setMode(mode==='login'?'signup':'login')};
$('abtn').onclick=async function(){
  var m=$('amsg'),b=$('abtn'),em=$('em').value.trim(),pw=$('pw').value;m.className='msg';
  if(!em||pw.length<8){m.textContent='Enter your email and a password of 8+ characters.';return}
  b.disabled=true;
  if(mode==='signup'){
    if(!$('fn').value.trim()){m.textContent='Enter your name.';b.disabled=false;return}
    if(!$('tos').checked){m.textContent='Please accept the Terms and Privacy Policy.';b.disabled=false;return}
    var r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('fn').value.trim()}}});
    if(r.error)m.textContent=r.error.message;
    else if(!r.data.session){m.className='msg ok';m.textContent='Account created. Check your email to confirm, then log in.'}
  }else{
    var l=await sb.auth.signInWithPassword({email:em,password:pw});
    if(l.error)m.textContent=l.error.message;
  }
  b.disabled=false;
};
$('out').onclick=function(){sb.auth.signOut()};
sb.auth.onAuthStateChange(function(ev,s){
  if(!s){me=null;prof=null;$('app').hidden=true;$('auth').hidden=false;return}
  if(me&&me.id===s.user.id){me=s.user;return}
  me=s.user;$('auth').hidden=true;$('app').hidden=false;setTimeout(function(){show('feed')},0);
});

/* ---------- Feed ---------- */
async function loadFeed(){
  var f=$('feed');if(!feed.length)f.innerHTML='<p class="note">Loading…</p>';
  var r=await sb.from('posts').select('id,user_id,image_path,caption,created_at,profiles!posts_user_id_fkey(username,full_name),likes(user_id),comments(id)').order('created_at',{ascending:false}).limit(30);
  if(r.error){f.innerHTML='<p class="msg">Could not load posts: '+esc(r.error.message)+'</p>';return}
  feed=r.data;renderFeed();
}
function renderFeed(){
  var f=$('feed');
  if(!feed.length){f.innerHTML='<p class="note">No posts yet. Be the first to share a photo.</p>';return}
  f.innerHTML=feed.map(function(p){
    var nm=(p.profiles&&(p.profiles.full_name||p.profiles.username))||'Member',un=p.profiles?p.profiles.username:'';
    var liked=p.likes.some(function(l){return l.user_id===me.id}),mine=p.user_id===me.id;
    return '<article class="post" data-id="'+p.id+'"><div class="ph"><div class="av">'+esc(nm[0].toUpperCase())+'</div><div><b>'+esc(nm)+'</b><small>@'+esc(un)+' · '+ago(p.created_at)+'</small></div></div>'+
    '<img class="pic" loading="lazy" alt="'+esc(p.caption||'Photo by '+nm)+'" src="'+esc(url(p.image_path))+'">'+
    '<div class="pa"><button data-a="like" class="'+(liked?'on':'')+'" aria-label="Like">'+svg('heart')+p.likes.length+'</button>'+
    '<button data-a="cm" aria-label="Comments">'+svg('comment')+p.comments.length+'</button><span class="sp"></span>'+
    (mine?'<button data-a="del" aria-label="Delete post">'+svg('trash')+'</button>':'<button data-a="rp" aria-label="Report">'+svg('flag')+'</button>')+'</div>'+
    (p.caption?'<div class="cap">'+esc(p.caption)+'</div>':'')+'<div class="rp" hidden><button data-why="copyright">Copyright</button><button data-why="abuse">Abuse</button><button data-why="other">Other</button></div><div class="cm" hidden></div></article>'}).join('');
}
$('feed').onclick=async function(e){
  var b=e.target.closest('button');if(!b)return;var art=b.closest('.post'),id=art.dataset.id;
  var p=feed.find(function(x){return x.id===id}),a=b.dataset.a;
  if(a==='like'){
    var had=p.likes.some(function(l){return l.user_id===me.id});
    p.likes=had?p.likes.filter(function(l){return l.user_id!==me.id}):p.likes.concat([{user_id:me.id}]);renderFeed();
    var r=had?await sb.from('likes').delete().match({post_id:id,user_id:me.id}):await sb.from('likes').insert({post_id:id,user_id:me.id});
    if(r.error&&r.error.code!=='23505')loadFeed();
  }else if(a==='cm'){
    var box=art.querySelector('.cm');box.hidden=!box.hidden;if(!box.hidden)loadComments(id,box);
  }else if(a==='rp'){var rp=art.querySelector('.rp');rp.hidden=!rp.hidden}
  else if(a==='del'){
    if(!confirm('Delete this post?'))return;
    var d=await sb.from('posts').delete().eq('id',id);
    if(!d.error){await sb.storage.from('posts').remove([p.image_path]);loadFeed()}
  }else if(b.dataset.why){
    var rr=await sb.from('reports').insert({post_id:id,reporter_id:me.id,reason:b.dataset.why});
    art.querySelector('.rp').hidden=true;
    alert(rr.error&&rr.error.code!=='23505'?'Could not send report.':'Thanks. Your report was received.'+(b.dataset.why==='copyright'?' The post is hidden while we review it.':''));
    loadFeed();
  }
};
async function loadComments(id,box){
  box.innerHTML='Loading…';
  var r=await sb.from('comments').select('body,created_at,profiles!comments_user_id_fkey(username)').eq('post_id',id).order('created_at');
  var rows=(r.data||[]).map(function(c){return '<p><b>'+esc(c.profiles?c.profiles.username:'member')+'</b> '+esc(c.body)+'</p>'}).join('');
  box.innerHTML=rows+'<form><input type="text" maxlength="300" placeholder="Write a comment" aria-label="Comment"><button class="s" type="submit">Send</button></form>';
  box.querySelector('form').onsubmit=async function(ev){ev.preventDefault();
    var inp=box.querySelector('input'),t=inp.value.trim();if(!t)return;
    var w=await sb.from('comments').insert({post_id:id,user_id:me.id,body:t});
    if(w.error){alert('Could not post comment.');return}
    loadComments(id,box);var p=feed.find(function(x){return x.id===id});p.comments.push({id:'n'});
  };
}

/* ---------- Create ---------- */
var blob=null;
$('pic').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,1080/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    cv.toBlob(function(b){blob=b;$('prev').src=URL.createObjectURL(b);$('prev').hidden=false;$('pickBox').hidden=true},'image/jpeg',.75)};im.src=rd.result};
  rd.readAsDataURL(f)};
$('share').onclick=async function(){
  var m=$('cmsg'),b=$('share');m.className='msg';
  if(!blob){m.textContent='Choose a photo first.';return}
  if(!$('own').checked){m.textContent='Confirm that the photo is yours.';return}
  b.disabled=true;m.textContent='';
  var path=me.id+'/'+Date.now()+'.jpg';
  var u=await sb.storage.from('posts').upload(path,blob,{contentType:'image/jpeg'});
  if(u.error){m.textContent='Upload failed: '+u.error.message;b.disabled=false;return}
  var i=await sb.from('posts').insert({user_id:me.id,image_path:path,caption:$('cap').value.trim()});
  b.disabled=false;
  if(i.error){await sb.storage.from('posts').remove([path]);m.textContent='Could not post: '+i.error.message;return}
  blob=null;$('prev').hidden=true;$('pickBox').hidden=false;$('pic').value='';$('cap').value='';$('own').checked=false;show('feed');
};

/* ---------- Profile ---------- */
async function loadProfile(){
  var r=await sb.from('profiles').select('username,full_name,bio').eq('id',me.id).single();
  if(r.data){prof=r.data;$('pf').value=prof.full_name||'';$('pu').value=prof.username||'';$('pb').value=prof.bio||''}
  var g=await sb.from('posts').select('image_path').eq('user_id',me.id).order('created_at',{ascending:false}).limit(30);
  $('pgrid').innerHTML=(g.data||[]).map(function(x){return '<img alt="Your post" loading="lazy" src="'+esc(url(x.image_path))+'">'}).join('');
}
$('psave').onclick=async function(){
  var m=$('pmsg'),un=$('pu').value.trim().toLowerCase();m.className='msg';
  if(!/^[a-z0-9_]{3,20}$/.test(un)){m.textContent='Username: 3–20 letters, numbers or underscore.';return}
  var r=await sb.from('profiles').update({full_name:$('pf').value.trim(),username:un,bio:$('pb').value.trim()}).eq('id',me.id);
  if(r.error){m.textContent=r.error.code==='23505'?'That username is taken.':r.error.message;return}
  m.className='msg ok';m.textContent='Saved.';
};
})();
</script>
</body>
</html>
